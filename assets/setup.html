<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="5x-api-endpoint" content="/v1/api">
    <title>Content Server - Setup</title>
    <link rel="stylesheet" href="/5x-content/setup.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="icon-box">
                <svg viewBox="0 0 24 24">
                    <path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1M12,5A3,3 0 0,1 15,8A3,3 0 0,1 12,11A3,3 0 0,1 9,8A3,3 0 0,1 12,5M17.13,17C15.92,18.85 14.11,20.24 12,20.92C9.89,20.24 8.08,18.85 6.87,17C6.53,16.5 6.24,16 6,15.47C6,13.82 8.71,12.47 12,12.47C15.29,12.47 18,13.79 18,15.47C17.76,16 17.47,16.5 17.13,17Z"/>
                </svg>
            </div>
            <div class="header-text">
                <h1>Content Server</h1>
                <p>Initial setup required</p>
            </div>
        </div>

        <div class="setup-info">
            <p>Create your administrator account to continue.</p>
        </div>

        <form id="setup-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username" minlength="3">
                <span class="hint">Minimum 3 characters</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Choose a secure password" required autocomplete="new-password" minlength="8">
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <svg id="eye-icon" viewBox="0 0 24 24">
                            <path d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z"/>
                        </svg>
                    </button>
                </div>
                <span class="hint">Minimum 8 characters</span>
            </div>

            <div class="form-group">
                <label for="password-confirm">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password-confirm" name="password-confirm" placeholder="Repeat your password" required autocomplete="new-password" minlength="8">
                    <button type="button" class="toggle-password-confirm" aria-label="Toggle password visibility">
                        <svg id="eye-icon-confirm" viewBox="0 0 24 24">
                            <path d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="error-message" id="error-message"></div>

            <button type="submit">Create Administrator Account</button>
        </form>
    </div>

    <script src="/5x-content/setup.js"></script>
</body>
</html>
